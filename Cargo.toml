[package]
name = "rapt"
version = "0.1.0"
edition = "2024"
description = "Pure async Rust client and library for querying the Ubuntu archive"
license = "GPL-3.0-only"
repository = "https://github.com/canonical/rapt"
keywords = ["ubuntu", "apt", "packages", "archive", "debian"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["default"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
xz2 = "0.1.7"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
